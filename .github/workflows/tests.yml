name: tests

# main 에 푸시될 때(병합 후 확인)와 모든 PR 에서 단위 테스트를 돌린다.
# pull_request 이벤트가 PR 브랜치의 push 를 대신 커버하므로 중복 실행되지 않는다.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 수집되는 테스트(tests/test_tiles.py, test_tile_protocol.py, test_config.py)는
      # tiles / tile_protocol / config 만 import 하고, 이들은 표준 라이브러리로만
      # 동작한다. mediapipe·opencv·dlib 등 무거운 런타임 의존성은 테스트에 필요
      # 없으므로 requirements.txt 를 통째로 깔지 않고 pytest 만 설치해 빠르고
      # 안정적으로 유지한다.
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      # `python -m pytest` 로 실행해야 현재 작업 디렉터리(레포 루트)가 sys.path 에
      # 들어가 루트의 tiles.py 등이 import 된다. 맨 `pytest` 로는 import 에러가 난다.
      - name: Run unit tests
        run: python -m pytest tests/ -q
